# /etc/manatech/motd.conf - per-host settings for the Manatech login banner.
# Sourced as shell by /usr/local/share/manatech/motd-lib.sh. Set ENV_NAME and
# ROLE on every host cloned from the template: an UNSET badge means nobody did.

# UNSET = take the environment from the prefix of this computer's AD
# Description ("PROD: Hyper-V host"; install.sh --ad caches it). Any other
# value wins over AD. Colours per environment: envs.tsv.
ENV_NAME=UNSET

# Where the environment shows: strip (above the panel), row (env row), both,
# or none.
ENV_SHOW="strip row"

# Top-right badge: site-vlan shows "<site> - <VLAN name>" (site from the host
# name, VLAN from the primary address and vlans.tsv) in the VLAN's colour;
# env shows ENV_NAME.
BADGE=site-vlan

# One line: what this host is for. Blank = the role from the AD Description.
ROLE=

# Services that must be running; each one that is not is reported in red.
WATCH="ssh zabbix-agent2"

# truecolor (PuTTY, MobaXterm, Windows Terminal), 256, 16, or none.
COLOR=truecolor

# unicode, or ascii for a client that is not set to UTF-8.
GLYPHS=unicode

# Report a local filesystem / memory at this percentage used (red from 95).
DISK_WARN=85
MEM_WARN=90

# Naming-schema field whose colour (schema-names.tsv) draws the panel border:
# site, type, subtype or os. "none", or a host name outside the schema, keeps
# the environment colour.
BORDER_BY=type

# Interfaces not listed in the ipv4 rows (extended regex; empty = list all).
IFACE_HIDE='^(docker|br-|veth|virbr|lxcbr|cni|flannel)'
