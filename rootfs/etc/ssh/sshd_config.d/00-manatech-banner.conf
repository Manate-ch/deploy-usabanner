# Pre-authentication banner. Plain text on purpose: SSH clients strip or
# expose escape codes in this banner, and it is shown before login, so it
# names no OS, version or address. Named 00- because sshd uses the first
# Banner it reads, and drop-ins are read in name order. Our own file, not
# /etc/issue.net: that one is a base-files conffile, kept stock so apt never
# asks about it.
Banner /etc/manatech/issue.net
